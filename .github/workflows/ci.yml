name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No MySQL in this container: native integration tests explicitly skip.
    container: python:3.12.15-slim-bookworm
    steps:
      - name: Install test tools
        run: apt-get update && apt-get install -y --no-install-recommends git make rsync openssh-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust only this container-mounted checkout
        # The runner owns the bind mount; the container uses a different UID.
        # Checkout's temporary Git configuration does not persist to run steps.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check shareable source
        run: make check-repository
      - name: Run portable tests
        run: make test
      - name: Check whitespace
        run: git diff --check
      - name: Verify clean export
        run: make export-public

  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API image without data or secrets
        run: docker build --tag ojs-api:ci .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: python:3.12.15-slim-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install audit tool in the disposable job
        run: python -m pip install pip-audit==2.10.1
      - name: Check known runtime dependency advisories
        run: python -m pip_audit -r requirements.txt --strict --progress-spinner off
